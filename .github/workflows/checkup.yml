name: Check Nix configurations

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      # learn-t9a is private; CI evaluates and builds against a stub (ci/learn-t9a-stub).
      STUB: --override-input learn-t9a path:./ci/learn-t9a-stub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Evaluate hosts and check the flake
        run: |
          nix eval --raw .#darwinConfigurations.m2-macbook-air.system.drvPath --no-update-lock-file --no-write-lock-file $STUB
          nix eval --raw .#nixosConfigurations.vps.config.system.build.toplevel.drvPath --no-update-lock-file --no-write-lock-file $STUB
          nix eval --raw .#nixosConfigurations.vps-fredy-bootstrap.config.system.build.toplevel.drvPath --no-update-lock-file --no-write-lock-file $STUB
          nix eval --raw .#nixosConfigurations.desktop-pc.config.system.build.toplevel.drvPath --no-update-lock-file --no-write-lock-file $STUB
          nix flake check --no-build --all-systems --no-update-lock-file --no-write-lock-file $STUB
          git diff --check
      - name: Build both VPS stages on Linux
        run: |
          nix build .#nixosConfigurations.vps-fredy-bootstrap.config.system.build.toplevel --no-link --no-update-lock-file --no-write-lock-file $STUB
          nix build .#nixosConfigurations.vps.config.system.build.toplevel --no-link --no-update-lock-file --no-write-lock-file $STUB
